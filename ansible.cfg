[defaults]
gathering = smart
inventory = ./inventory
roles_path = ./roles:./.ansible/roles
collections_path = ./.ansible/collections:~/.ansible/collections:/usr/share/ansible/collections
fact_caching = jsonfile
fact_caching_connection = ~/ansible/ansibleCacheDir
fact_caching_timeout = 86400
remote_tmp = /var/tmp/.ansible/tmp
pipelining = True
interpreter_python = auto_silent
# Set to false when working with cloud instances if you haven't connect to the instance yet.
# host_key_checking = False  
# Use the YAML callback plugin.
result_format=yaml
# Use the stdout_callback when running ad-hoc commands.
bin_ansible_callbacks = True