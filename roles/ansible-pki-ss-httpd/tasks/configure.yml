---

- name: Configure EJBCA Apache HTTPD conf files
  block:

    - name: Configure EJBCA Apache HTTPD configuration files for Alma/CentOS/Oracle/RedHat/Rocky 8/9/10
      ansible.builtin.template:
        backup: yes
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: 0644
      loop: "{{ httpd_conf_files_8 }}"
      loop_control:
        label: "{{ item.src }}"
      notify:
        - restart httpd
      tags: reverse-proxy
      when: 
        - (ansible_facts['distribution'] == "RedHat" and (ansible_facts['distribution_major_version'] | int) >= 9) or
          (ansible_facts['distribution'] == "AlmaLinux" and (ansible_facts['distribution_major_version'] | int) >= 9) or
          (ansible_facts['distribution'] == "CentOS" and ansible_facts['distribution_major_version'] == "8") or
          (ansible_facts['distribution'] == "RedHat" and ansible_facts['distribution_major_version'] == "8") or
          (ansible_facts['distribution'] == "OracleLinux" and ansible_facts['distribution_major_version'] == "8") or
          (ansible_facts['distribution'] == "Rocky" and (ansible_facts['distribution_major_version'] | int) >= 8) or
          (ansible_facts['distribution'] == "AlmaLinux" and ansible_facts['distribution_major_version'] == "8") or
          (ansible_facts['distribution'] == "OracleLinux" and (ansible_facts['distribution_major_version'] | int) >= 10)

    - name: Configure EJBCA Apache HTTPD configuration files for CentOS/RedHat 7
      ansible.builtin.template:
        backup: yes
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: 0644
      loop: "{{ httpd_conf_files_7 }}"
      loop_control:
        label: "{{ item.src }}"
      notify:
        - restart httpd
      tags: reverse-proxy
      when: 
        - (ansible_facts['distribution'] == "CentOS" and ansible_facts['distribution_major_version'] == "7") or
          (ansible_facts['distribution'] == "RedHat" and ansible_facts['distribution_major_version'] == "7") 

    - name: Configure EJBCA Apache HTTPD configuration files for Debian
      ansible.builtin.template:
        backup: yes
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: 0644
      loop: "{{ httpd_conf_files_debian }}"
      loop_control:
        label: "{{ item.src }}"
      notify:
        - restart httpd
      tags: reverse-proxy
      when:
        - ansible_facts['os_family'] == 'Debian'
  when: 
    - inventory_hostname in groups['eeCaServers'] or
      inventory_hostname in groups['eeRaServers'] or
      inventory_hostname in groups['eeVaServers'] or
      inventory_hostname in groups['ceServers']

- name: Configure SignServer Apache HTTPD configuration files
  block:

    - name: Configure SignServer Apache HTTPD configuration files for Alma/CentOS/Oracle/RedHat/Rocky 8/9/10
      ansible.builtin.template:
        backup: yes
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
