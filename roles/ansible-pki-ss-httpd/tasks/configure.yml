  when: 
    - inventory_hostname in groups['eeSignServers'] or
      inventory_hostname in groups['ceSignServers']

- name: Enable Debian Apache modules
  ansible.builtin.command: "a2enmod {{ item }}"
  loop: "{{ httpd_debian_modules }}"
  loop_control:
    label: "{{ item }}"
  register: a2enmod_result
  changed_when: "'already enabled' not in a2enmod_result.stdout"
  when:
    - not ansible_check_mode
    - ansible_facts['os_family'] == 'Debian'
  notify:
    - restart httpd

- name: Enable Debian EJBCA Apache site
  ansible.builtin.command: a2ensite ejbca
  register: a2ensite_result
  changed_when: "'already enabled' not in a2ensite_result.stdout"
  when:
    - not ansible_check_mode
    - ansible_facts['os_family'] == 'Debian'
  notify:
    - restart httpd

- name: Disable default Apache sites on Debian
  ansible.builtin.command: "a2dissite {{ item }}"
  loop:
    - 000-default
    - default-ssl
  loop_control:
    label: "{{ item }}"
  register: a2dissite_result
  changed_when: "'Site ' ~ item ~ ' already disabled' not in a2dissite_result.stdout"
  failed_when: false
  when:
    - not ansible_check_mode
    - ansible_facts['os_family'] == 'Debian'
  notify:
    - restart httpd

- name: Configure friendly AIA &| CRL name mapping
  block:

    - name: Create directory for mapping file
      ansible.builtin.file:
        path: "{{ httpd_rewrite_maps_dir }}/"
        state: directory
        mode: 0775
        owner: root
        group: root  
      tags: reverse-proxy

    - name: Create CRL mapping file
      ansible.builtin.template:
        src: crlmapping.txt.j2
        dest: "{{ httpd_rewrite_maps_dir }}/crlmapping.txt"
        owner: root
        group: root
        mode: 0644
      when:
        - use_httpd_crl_map is defined
        - use_httpd_crl_map|bool

    - name: Create AIA mapping file
      ansible.builtin.template:
        src: aiamapping.txt.j2
        dest: "{{ httpd_rewrite_maps_dir }}/aiamapping.txt"
        owner: root
        group: root
        mode: 0644
      when:
        - use_httpd_aia_map
        - use_httpd_aia_map|bool

  when:
    - ( use_httpd_crl_map is defined and use_httpd_crl_map|bool ) or ( use_httpd_aia_map is defined and use_httpd_aia_map|bool)

- name: Create CRL & AIA directory links
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
  loop: "{{ httpd_web_dirs }}"
  loop_control:
    label:  "{{ item.dest }}"
  tags: reverse-proxy
  when: 
    - httpd_create_aia_crl_dir|bool

- name: Check if index.html exists
  ansible.builtin.stat:
    path: /var/www/html/index.html
  register: index_html_exists
  changed_when: false

- name: Create the index.html file
  ansible.builtin.file:
    path: /var/www/html/index.html
    state: touch
    mode: 0644
    owner: "{{ httpd_runtime_user }}"
    group: "{{ httpd_runtime_group }}"  
  tags: reverse-proxy
  when: 
    - not index_html_exists.stat.exists

- name: Check SELinux HTTPD Network Connect boolean
  ansible.builtin.command: getsebool httpd_can_network_connect
  register: httpd_can_network_connect_status
  changed_when: false
  failed_when: false
  tags: reverse-proxy
  when:
    - ansible_facts['os_family'] != 'Debian'
    - ansible_facts.selinux is defined
    - ansible_facts.selinux.status == 'enabled'

- name: Set SELinux HTTPD Network Connect
  ansible.builtin.command: setsebool -P httpd_can_network_connect on
  tags: reverse-proxy
  when:
    - ansible_facts['os_family'] != 'Debian'
    - ansible_facts.selinux is defined
    - ansible_facts.selinux.status == 'enabled'
    - httpd_can_network_connect_status.rc == 0
    - "'--> on' not in httpd_can_network_connect_status.stdout"

- name: Create CA certificate download page directory
  ansible.builtin.file:
    path: "{{ httpd_public_download_dir }}"
    state: directory
    mode: 0755
    owner: "{{ httpd_runtime_user }}"
    group: "{{ httpd_runtime_group }}"
  tags: reverse-proxy
  when:
    - inventory_hostname in groups['eeCaServers'] or
      inventory_hostname in groups['eeRaServers'] or
      inventory_hostname in groups['eeVaServers'] or
      inventory_hostname in groups['ceServers']

- name: Render CA certificate download page
  ansible.builtin.template:
    src: publicweb-downloads.html.j2
    dest: "{{ httpd_public_download_dir }}/index.html"
    mode: 0644
    owner: "{{ httpd_runtime_user }}"
    group: "{{ httpd_runtime_group }}"
  notify:
    - restart httpd
  tags: reverse-proxy
  when:
    - inventory_hostname in groups['eeCaServers'] or
      inventory_hostname in groups['eeRaServers'] or
      inventory_hostname in groups['eeVaServers'] or
      inventory_hostname in groups['ceServers']

- name: Configure Firewalld
  block:
    - name: Open http port on firewalld
      ansible.posix.firewalld:
        service: 'http'
        permanent: yes
        immediate: yes
        state: enabled

    - name: Open https port on firewalld
      ansible.posix.firewalld:
        service: 'https'
        permanent: yes
        immediate: yes
        state: enabled

  tags: reverse-proxy
  when: 
    - enable_firewalld_for_httpd|bool
    - ansible_facts['os_family'] != 'Debian'

- name: Ensure Apache HTTPD service is restarted
  ansible.builtin.systemd_service:
    name: "{{ httpd_service_name }}"
    state: started
    enabled: true
  tags: reverse-proxy
  when:
    - not ansible_check_mode
