---
# roles/ansible-ejbca-httpd/vars/main.yml

httpd_conf_files_8:
  - src: httpd.conf.j2
    dest: /etc/httpd/conf/httpd.conf
  - src: ssl.conf.j2
    dest: /etc/httpd/conf.d/ssl.conf
  - src: 00-base.conf.j2
    dest: /etc/httpd/conf.modules.d/00-base.conf
  - src: 00-dav.conf.j2
    dest: /etc/httpd/conf.modules.d/00-dav.conf
  - src: 00-lua.conf.j2
    dest: /etc/httpd/conf.modules.d/00-lua.conf
  - src: 00-proxy.conf.j2
    dest: /etc/httpd/conf.modules.d/00-proxy.conf
  - src: 01-cgi.conf.j2
    dest: /etc/httpd/conf.modules.d/01-cgi.conf
  - src: 80.conf.j2
    dest: /etc/httpd/conf.d/80.conf

httpd_conf_files_7:
  - src: httpd.conf.j2
    dest: /etc/httpd/conf/httpd.conf
  - src: ssl.conf.j2
    dest: /etc/httpd/conf.d/ssl.conf
  - src: 80.conf.j2
    dest: /etc/httpd/conf.d/80.conf

httpd_conf_files_debian:
  - src: debian-ejbca.conf.j2
    dest: /etc/apache2/sites-available/ejbca.conf

pass_33: "{{ lookup('password', '/dev/null length=33 chars=ascii_letters') }}"
pass_15: "{{ lookup('password', '/dev/null length=15 chars=ascii_letters') }}"

httpd_packages: "{{ ['apache2'] if ansible_facts['os_family'] == 'Debian' else ['httpd', 'mod_ssl'] }}"
httpd_service_name: "{{ 'apache2' if ansible_facts['os_family'] == 'Debian' else 'httpd' }}"
httpd_runtime_user: "{{ 'www-data' if ansible_facts['os_family'] == 'Debian' else 'apache' }}"
httpd_runtime_group: "{{ 'www-data' if ansible_facts['os_family'] == 'Debian' else 'apache' }}"
httpd_rewrite_maps_dir: "{{ '/etc/apache2/rewriteMaps' if ansible_facts['os_family'] == 'Debian' else '/etc/httpd/rewriteMaps' }}"
httpd_tls_cert_dir: "{{ '/etc/ssl/certs' if ansible_facts['os_family'] == 'Debian' else '/etc/pki/tls/certs' }}"
httpd_tls_private_dir: "{{ '/etc/ssl/private' if ansible_facts['os_family'] == 'Debian' else '/etc/pki/tls/private' }}"
httpd_public_download_dir: /var/www/html/ca-certificates-and-crls
httpd_tls_cert_file: "{{ httpd_tls_cert_dir }}/{{ httpd_identity_info.id_name }}.crt"
httpd_tls_key_file: "{{ httpd_tls_private_dir }}/{{ httpd_identity_info.id_name }}.key"
httpd_tls_chain_file: "{{ httpd_tls_cert_dir }}/chain.crt"
httpd_trusted_ca_file: "{{ httpd_tls_cert_dir }}/trusted-ca.crt"
httpd_debian_modules:
  - ssl
  - headers
  - rewrite
  - proxy
  - proxy_ajp
  - proxy_balancer
  - slotmem_shm
  - lbmethod_byrequests