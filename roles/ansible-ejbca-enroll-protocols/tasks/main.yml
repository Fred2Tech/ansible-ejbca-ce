---
# tasks file for roles/ansible-ejbca-enroll-protocols

- name: Wait for EJBCA CLI to be reachable for protocol management
  ansible.builtin.command: "{{ ejbca_sh }} config protocols list"
  args:
    chdir: "{{ ejbca_home }}"
  become_user: "{{ ejbca_user }}"
  become: true
  register: check_protocols_cli_result
  until: check_protocols_cli_result.rc == 0
  retries: 12
  delay: 5
  changed_when: false
  failed_when: check_protocols_cli_result.rc != 0
  when:
    - not ansible_check_mode
    - enable_ejbca_protocols[0] is defined or disable_ejbca_protocols[0] is defined

- name: Disable Protocols Services 
  ansible.builtin.command: "{{ ejbca_sh }} config protocols disable '{{ item.name }}'"
  args:
    chdir: "{{ ejbca_home }}"
  become_user: "{{ ejbca_user }}"
  become: true
  loop: "{{ disable_ejbca_protocols }}"
  loop_control:
    label: "{{ item.name }}"
  register: disable_ejbca_protocols_result
  when:
    - not ansible_check_mode
    - disable_ejbca_protocols[0] is defined
  ignore_errors: true
  changed_when: false

- name: Enable Protocol Services 
  ansible.builtin.command: "{{ ejbca_sh }} config protocols enable '{{ item.name }}'"
  args:
    chdir: "{{ ejbca_home }}"
  become_user: "{{ ejbca_user }}"
  become: true
  loop: "{{ enable_ejbca_protocols }}"
  loop_control:
    label: "{{ item.name }}"
  register: enable_ejbca_protocols_result
  when:
    - not ansible_check_mode
    - enable_ejbca_protocols[0] is defined
  changed_when: false
