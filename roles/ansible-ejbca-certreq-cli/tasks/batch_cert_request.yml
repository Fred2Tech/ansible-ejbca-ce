---

- name: Check if {{ item.username }} end entity exists
  ansible.builtin.command: "{{ ejbca_sh }} ra findendentity {{ item.username }}"
  args:
    chdir: "{{ ejbca_home }}"
  become: true
  become_user: "{{ ejbca_user }}"
  changed_when: false
  failed_when: false
  register: endentity_exists
  tags: certreq-cli-batch

- name: Check if {{ item.username }} certificate PEM file exists
  ansible.builtin.stat:
    path: >-
      {% if item.token is defined and 'PEM' == item.token and item.useType is defined and (item.useType == 'ra' or item.useType == 'va' or item.useType == 'root' or item.useType == 'signserver' or item.useType == 'ca') %}
      {{ identity_batch_output_dir }}/pem/{{ item.name | default(item.username, true) | default(item.caname, true) }}.pem
      {% else %}
      {{ ejbca_home }}/p12/pem/{{ item.name | default(item.username, true) | default(item.caname, true) }}.pem
      {% endif %}
  register: pem_file_exists
  changed_when: false
  when:
    - item.token is defined
    - item.token == 'PEM'
  tags: certreq-cli-batch

- name: Check if {{ item.username }} PKCS12 file exists
  ansible.builtin.stat:
    path: "{{ ejbca_home }}/p12/{{ item.username }}.p12"
  register: p12_file_exists
  changed_when: false
  when:
    - item.token is defined
    - item.token == 'P12'
  tags: certreq-cli-batch

#- ansible.builtin.debug:
#    var: endentity_exists

- ansible.builtin.debug:
    msg: "Failed to query username: {{ endentity_exists.stdout }}"
  when: 
    - endentity_exists.stderr is defined
    - "'FAILED' in endentity_exists.stderr"
  failed_when: true

- name: Create the entity in EJBCA and generate a certificate
  block:

  - name: Add {{ item.username }} Entity to CA
    ansible.builtin.command: >
      {{ ejbca_sh }} ra addendentity 
      --username '{{ item.username }}' 
      --password '{{  item.password }}' 
      --dn {% if item.full_dn is defined %}'{{ item.full_dn }}'{% else %}'{{ item.dn }}'{% endif %}
      {% if item.altname is defined %}--altname '{{ item.altname }}'{% endif %}
      --caname '{{ item.caname }}' 
      --type 1 
      --token {{ item.token }} 
      --certprofile '{{ item.certprofile }}' 
      --eeprofile '{{ item.eeprofile }}'
    args:
      chdir: "{{ ejbca_home }}"
    become_user: "{{ ejbca_user }}"
    become: true
    register: ra_addIdent_result
    tags: certreq-cli-batch
    no_log: "{{ no_log_value }}"
    failed_when: ra_addIdent_result.rc != 0
    changed_when: ra_addIdent_result.rc == 0
    when:
      - endentity_exists.rc != 0 or 'does not exist' in ((endentity_exists.stdout | default('')) ~ (endentity_exists.stderr | default('')))

  - name: Wait for database sync after {{ item.username }} creation
    ansible.builtin.pause:
      seconds: 20
    when:
      - ra_addIdent_result is defined
      - ra_addIdent_result.changed | bool

  - name: Verify {{ item.username }} end entity exists after creation (attempt 1)
    ansible.builtin.command: "{{ ejbca_sh }} ra findendentity {{ item.username }}"
    args:
      chdir: "{{ ejbca_home }}"
    become_user: "{{ ejbca_user }}"
    become: true
    register: endentity_exists_after_add_attempt1
    changed_when: false
    failed_when: false
    when:
      - ra_addIdent_result is defined
      - ra_addIdent_result.changed | bool

  - name: Wait before second verification attempt
    ansible.builtin.pause:
      seconds: 10
    when:
      - ra_addIdent_result is defined
      - ra_addIdent_result.changed | bool
      - endentity_exists_after_add_attempt1 is defined
      - endentity_exists_after_add_attempt1.rc != 0 or 'does not exist' in ((endentity_exists_after_add_attempt1.stdout | default('')) ~ (endentity_exists_after_add_attempt1.stderr | default('')))

  - name: Verify {{ item.username }} end entity exists after creation (attempt 2)
    ansible.builtin.command: "{{ ejbca_sh }} ra findendentity {{ item.username }}"
    args:
      chdir: "{{ ejbca_home }}"
    become_user: "{{ ejbca_user }}"
    become: true
    register: endentity_exists_after_add_attempt2
    changed_when: false
    failed_when: false
    when:
      - ra_addIdent_result is defined
      - ra_addIdent_result.changed | bool
      - endentity_exists_after_add_attempt1 is defined
      - endentity_exists_after_add_attempt1.rc != 0 or 'does not exist' in ((endentity_exists_after_add_attempt1.stdout | default('')) ~ (endentity_exists_after_add_attempt1.stderr | default('')))

  - name: Set final verification result after creation
    ansible.builtin.set_fact:
      endentity_exists_after_add: >-
        {{
          endentity_exists_after_add_attempt2
          if (endentity_exists_after_add_attempt2 is defined and endentity_exists_after_add_attempt2 is not skipped)
          else endentity_exists_after_add_attempt1
        }}
    when:
      - ra_addIdent_result is defined
      - ra_addIdent_result.changed | bool

  - name: Retry adding {{ item.username }} end entity when first creation did not persist
    ansible.builtin.command: >
      {{ ejbca_sh }} ra addendentity 
      --username '{{ item.username }}' 
      --password '{{  item.password }}' 
      --dn {% if item.full_dn is defined %}'{{ item.full_dn }}'{% else %}'{{ item.dn }}'{% endif %}
      {% if item.altname is defined %}--altname '{{ item.altname }}'{% endif %}
      --caname '{{ item.caname }}' 
      --type 1 
      --token {{ item.token }} 
      --certprofile '{{ item.certprofile }}' 
      --eeprofile '{{ item.eeprofile }}'
    args:
      chdir: "{{ ejbca_home }}"
    become_user: "{{ ejbca_user }}"
    become: true
    register: ra_addIdent_retry_result
    tags: certreq-cli-batch
    no_log: "{{ no_log_value }}"
    failed_when: ra_addIdent_retry_result.rc != 0
    changed_when: ra_addIdent_retry_result.rc == 0
    when:
      - ra_addIdent_result is defined
      - ra_addIdent_result.changed | bool
      - endentity_exists_after_add is defined
      - endentity_exists_after_add.rc != 0 or 'does not exist' in ((endentity_exists_after_add.stdout | default('')) ~ (endentity_exists_after_add.stderr | default('')))

  - name: Wait for database sync after {{ item.username }} retry
    ansible.builtin.pause:
      seconds: 20
    when:
      - ra_addIdent_retry_result is defined
      - ra_addIdent_retry_result.changed | bool

  - name: Verify {{ item.username }} end entity exists after retry (attempt 1)
    ansible.builtin.command: "{{ ejbca_sh }} ra findendentity {{ item.username }}"
    args:
      chdir: "{{ ejbca_home }}"
    become_user: "{{ ejbca_user }}"
    become: true
    register: endentity_exists_after_retry_attempt1
    changed_when: false
    failed_when: false
    when:
      - ra_addIdent_retry_result is defined
      - ra_addIdent_retry_result.changed | bool

  - name: Wait before second verification attempt after retry
    ansible.builtin.pause:
      seconds: 10
    when:
      - ra_addIdent_retry_result is defined
      - ra_addIdent_retry_result.changed | bool
      - endentity_exists_after_retry_attempt1 is defined
      - endentity_exists_after_retry_attempt1.rc != 0 or 'does not exist' in ((endentity_exists_after_retry_attempt1.stdout | default('')) ~ (endentity_exists_after_retry_attempt1.stderr | default('')))

  - name: Verify {{ item.username }} end entity exists after retry (attempt 2)
    ansible.builtin.command: "{{ ejbca_sh }} ra findendentity {{ item.username }}"
    args:
      chdir: "{{ ejbca_home }}"
    become_user: "{{ ejbca_user }}"
    become: true
    register: endentity_exists_after_retry_attempt2
    changed_when: false
    failed_when: false
    when:
      - ra_addIdent_retry_result is defined
      - ra_addIdent_retry_result.changed | bool
      - endentity_exists_after_retry_attempt1 is defined
      - endentity_exists_after_retry_attempt1.rc != 0 or 'does not exist' in ((endentity_exists_after_retry_attempt1.stdout | default('')) ~ (endentity_exists_after_retry_attempt1.stderr | default('')))

  - name: Set final verification result after retry
    ansible.builtin.set_fact:
      endentity_exists_after_retry: >-
        {{
          endentity_exists_after_retry_attempt2
          if (endentity_exists_after_retry_attempt2 is defined and endentity_exists_after_retry_attempt2 is not skipped)
          else endentity_exists_after_retry_attempt1
        }}
    when:
      - ra_addIdent_retry_result is defined
      - ra_addIdent_retry_result.changed | bool

  - name: Track {{ item.username }} end entity availability after creation attempts
    vars:
      endentity_check_result: >-
        {{
          endentity_exists_after_retry
          if (endentity_exists_after_retry is defined and 'rc' in endentity_exists_after_retry)
          else (endentity_exists_after_add | default({}))
        }}
    ansible.builtin.set_fact:
      endentity_available_after_add: >-
        {{
          (endentity_check_result.get('rc', 1) == 0) and
          ('does not exist' not in (
            endentity_check_result.get('stdout', '') ~
            endentity_check_result.get('stderr', '')
          ))
        }}
    when:
      - ra_addIdent_result is defined
      - ra_addIdent_result.changed | bool

  - name: Fail when {{ item.username }} end entity is still missing after creation attempts
    ansible.builtin.fail:
      msg: >-
        End entity {{ item.username }} is still missing after addendentity retry.
        Initial add rc={{ ra_addIdent_result.rc | default('n/a') }},
        verify rc={{ endentity_exists_after_add.rc | default('n/a') }},
        retry add rc={{ ra_addIdent_retry_result.rc | default('not-run') }},
        final verify rc={{ endentity_exists_after_retry.rc | default('not-run') }}.
    when:
      - ra_addIdent_result is defined
      - ra_addIdent_result.changed | bool
      - endentity_available_after_add is defined
      - not endentity_available_after_add | bool

  - name: Migrate legacy certificateData rows in PostgreSQL for {{ item.username }}
    ansible.builtin.shell: >
      sudo -u postgres psql -d {{ database_name }} -v ON_ERROR_STOP=1 -c
      "UPDATE certificateData
      SET username='{{ item.username | replace("'", "''") }}'
      WHERE username='{{ legacy_username | replace("'", "''") }}'
      AND subjectdn='{% if item.full_dn is defined %}{{ item.full_dn | replace("'", "''") }}{% else %}{{ item.dn | replace("'", "''") }}{% endif %}';"
    delegate_to: "{{ database_server_inventory_name }}"
    become: true
    register: legacy_certdata_pg_migration
    loop: "{{ item.legacy_usernames | default([]) }}"
    loop_control:
      loop_var: legacy_username
      label: "{{ legacy_username }}"
    changed_when: "'UPDATE 0' not in legacy_certdata_pg_migration.stdout"
    no_log: "{{ no_log_value }}"
    tags: certreq-cli-batch
    when:
      - (item.legacy_usernames | default([])) | length > 0
      - database_engine == 'postgresql'

  - name: Migrate legacy certificateData rows in MariaDB for {{ item.username }}
    ansible.builtin.shell: >
      {{ mariadb_cmd }}
      --user=root
      --password='{{ mariadb_root_password | replace("'", "'\"'\"'") }}'
      {{ database_name }}
      --execute="UPDATE CertificateData
      SET username='{{ item.username | replace("'", "''") }}'
      WHERE username='{{ legacy_username | replace("'", "''") }}'
      AND subjectdn='{% if item.full_dn is defined %}{{ item.full_dn | replace("'", "''") }}{% else %}{{ item.dn | replace("'", "''") }}{% endif %}'; SELECT ROW_COUNT();"
    delegate_to: "{{ database_server_inventory_name }}"
    become: true
    register: legacy_certdata_mariadb_migration
    loop: "{{ item.legacy_usernames | default([]) }}"
    loop_control:
      loop_var: legacy_username
      label: "{{ legacy_username }}"
    changed_when: "'0' not in legacy_certdata_mariadb_migration.stdout_lines | default([])"
    no_log: "{{ no_log_value }}"
    tags: certreq-cli-batch
    when:
      - (item.legacy_usernames | default([])) | length > 0
      - database_engine == 'mariadb'

  - name: Remove legacy PKCS12 files for {{ item.username }}
    ansible.builtin.file:
      path: "{{ ejbca_home }}/p12/{{ legacy_username }}.p12"
      state: absent
    become_user: "{{ ejbca_user }}"
    become: true
    loop: "{{ item.legacy_usernames | default([]) }}"
    loop_control:
      loop_var: legacy_username
      label: "{{ legacy_username }}"
    tags: certreq-cli-batch
    when:
      - item.token is defined
      - item.token == 'P12'

  - name: Set {{ item.username }} status to NEW before regenerating certificate artifacts
    ansible.builtin.command: >
      {{ ejbca_sh }} ra setendentitystatus
      --username '{{ item.username }}'
      -S 10
    args:
      chdir: "{{ ejbca_home }}"
    become_user: "{{ ejbca_user }}"
    become: true
    register: ra_setstatus_result
    tags: certreq-cli-batch
    no_log: "{{ no_log_value }}"
    failed_when: ra_setstatus_result.rc != 0
    changed_when: ra_setstatus_result.rc == 0
    when:
      - >-
        (item.token == 'PEM' and pem_file_exists is defined and not pem_file_exists.stat.exists) or
        (item.token == 'P12' and p12_file_exists is defined and not p12_file_exists.stat.exists)
      - ra_addIdent_result is not defined or not ra_addIdent_result.changed | bool

  - name: Set password for {{ item.username }}
    ansible.builtin.command: >
      {{ ejbca_sh }} ra setclearpwd 
      --username '{{ item.username }}' 
      --password '{{ item.password }}'
    args:
      chdir: "{{ ejbca_home }}"
    become_user: "{{ ejbca_user }}"
    become: true
    register: ra_setpwd_result
    tags: certreq-cli-batch
    no_log: "{{ no_log_value }}"
    failed_when: ra_setpwd_result.rc != 0
    changed_when: ra_setpwd_result.rc == 0
    when:
      - >-
        endentity_exists.rc != 0 or
        'does not exist' in ((endentity_exists.stdout | default('')) ~ (endentity_exists.stderr | default(''))) or
        (item.token == 'PEM' and pem_file_exists is defined and not pem_file_exists.stat.exists) or
        (item.token == 'P12' and p12_file_exists is defined and not p12_file_exists.stat.exists)
      - endentity_available_after_add | default(true) | bool

  - name: Create certs for {{ item.username }}
    ansible.builtin.command: >
      {{ ejbca_sh }} batch 
      --username {{ item.username }} 
      {% if item.token is defined and 'PEM' == item.token and item.useType is defined %}
      {% if 'ra' == item.useType or 'va' == item.useType or 'root' == item.useType or 'signserver' == item.useType or 'ca' == item.useType %}
      -dir {{ identity_batch_output_dir }} 
      {% endif %}
      {% else %}
      -dir {{ ejbca_home }}/p12/
      {% endif %}
    args:
      chdir: "{{ ejbca_home }}"
    become_user: "{{ ejbca_user }}"
    become: true
    register: ra_batch_result
    tags: certreq-cli-batch
    no_log: "{{ no_log_value }}"
    failed_when: >-
      ra_batch_result.rc != 0 or
      'Unknown user, or clear text password is null' in ((ra_batch_result.stdout | default('')) ~ (ra_batch_result.stderr | default('')))
    changed_when: ra_batch_result.rc == 0
    when:
      - >-
        endentity_exists.rc != 0 or
        'does not exist' in ((endentity_exists.stdout | default('')) ~ (endentity_exists.stderr | default(''))) or
        (item.token == 'PEM' and pem_file_exists is defined and not pem_file_exists.stat.exists) or
        (item.token == 'P12' and p12_file_exists is defined and not p12_file_exists.stat.exists)
      - endentity_available_after_add | default(true) | bool

  #- debug:
      #msg: "Failed to create certs for username: {{ item.username }}"
      #var: ra_batch_result
    #when: 
    #  - "'FAILED' in endentity_exists.stderr"
    #failed_when: true

  tags: certreq-cli-batch

- name: Determine {{ item.username }} certificate serial number
  ansible.builtin.command: "openssl x509 -noout -serial -in {{ identity_batch_output_dir }}/pem/{{ item.name | default(item.username, true) | default(item.caname, true) }}.pem"
  no_log: false
  register: cert_serialNumber
  tags: certreq-cli-batch
  when: 
    - item.useType is defined
    - (item.useType == "ra") or (item.useType == "va")
    - ra_batch_result is defined
    - ra_batch_result.changed|bool or
      ra_force_batch_again is defined and ra_force_batch_again|bool

- name: RA specific
  block:
    # This block is to use the certiicate serial number of the external RA TLS cert and add to the
    # RA peering role on the CA. If the RA peering role does not exist yet the fact created remains
    # that is used to create the RA peering role when configuring peering at a later time.

    - name: Create fact for RA {{ item.username }} certificate serial number
      ansible.builtin.set_fact: 
        cacheable: yes
        ra_peer_cert_serial_numbers: |
          [
          {{ '{' }}  'cert_serial_Number':'{{ cert_serialNumber.stdout.split('=')[1] }}', 'caname':'{{ item.caname }}' {{ '}' }},
          ]
      tags: certreq-cli-batch

    - name: Add serial number to the RA Peering Role
      ansible.builtin.include_role: 
        name: ansible-ejbca-ca-add-sn-to-admin-role
        tasks_from: peer_add_sn_to_role
      vars:
        ejbca_ra_admin_role_name: "RA-Peer-Connection"
        certificate_serial_number: "{{ ra_peer_cert_serial_numbers }}"
      no_log: "{{ no_log_value }}"

    - name: Write RA cert serial numbers to file for use with EJBCA VA or RA playbooks 
      become: false
      ansible.builtin.copy:
        dest: "{{ ejbca_csr_dir_output }}/ra_peer_cert_serial_numbers.yml"
        content: "{{ ra_peer_cert_serial_numbers| to_nice_yaml }}"
      delegate_to: localhost
      register: write_the_output
      no_log: "{{ no_log_value }}"
      tags: certreq-cli-batch
      when: 
        - ra_peer_cert_serial_numbers is defined

  when:
    #- ejbca_src_dir_name is defined 
    - item.useType is defined
    - (item.useType == "ra")
    - ra_batch_result is defined
    - ra_batch_result.changed|bool or 
      ra_force_batch_again is defined and ra_force_batch_again|bool
 
- name: VA Specific
  block:

    - name: Create fact for VA {{ item.username }} certificate serial number
      ansible.builtin.set_fact: 
        cacheable: yes
        va_peer_cert_serial_numbers: |
          [
          {{ '{' }}  'cert_serial_Number':'{{ cert_serialNumber.stdout.split('=')[1] }}', 'caname':'{{ item.caname }}' {{ '}' }},
          ]
      tags: certreq-cli-batch

    - name: Write VA cert serial numbers to file for use with EJBCA VA or RA playbooks 
      become: false
      ansible.builtin.copy:
        dest: "{{ ejbca_csr_dir_output }}/va_peer_cert_serial_numbers.yml"
        content: "{{ va_peer_cert_serial_numbers| to_nice_yaml }}"
      delegate_to: localhost
      register: write_the_output
      no_log: "{{ no_log_value }}"
      tags: certreq-cli-batch
      when:
        - va_peer_cert_serial_numbers is defined

  when: 
    #- ejbca_src_dir_name is defined
    - item.useType is defined
    - (item.useType == "va")
    - ra_batch_result is defined
    - ra_batch_result.changed|bool or
      ra_force_batch_again is defined and ra_force_batch_again|bool

- name: Create peer_cert_serial_numbers variable if it is empty
  ansible.builtin.include_role: 
    name: ansible-ejbca-key-binding
    tasks_from: get_akb_serial_numbers
  when:
    - (peer_ca_cert_serial_numbers | default([], true)) | length == 0

- name: Copy file to Ansible controller when PEM file and RA/VA/SS or External Root Node
  block:

    - name: Copy {{ item.username }} certificate file {{ identity_batch_output_dir }}/pem/{{ item.name | default(item.username, true) | default(item.caname, true) }}.pem to localhost
      become: false
      ansible.builtin.fetch:
        src: "{{ identity_batch_output_dir }}/pem/{{ item.name | default(item.username, true) | default(item.caname, true) }}.pem"
        dest: "{{ ejbca_csr_dir_output }}/{{ item.name | default(item.username, true) | default(item.caname, true) }}.crt"
        flat: yes
      tags: certreq-cli-batch

    - name: Copy {{ item.username }} key file {{ identity_batch_output_dir }}/pem/{{ item.name | default(item.username, true) | default(item.caname, true) }}-Key.pem to localhost
      become: false
      ansible.builtin.fetch:
        src: "{{ identity_batch_output_dir }}/pem/{{ item.name | default(item.username, true) | default(item.caname, true) }}-Key.pem"
        dest: "{{ ejbca_csr_dir_output }}/{{ item.name | default(item.username, true) | default(item.caname, true) }}.key"
        flat: yes
      tags: certreq-cli-batch

    - name: Copy {{ item.username }} CA chain file to localhost
      become: false
      ansible.builtin.fetch:
        src: "{{ identity_batch_output_dir }}/pem/{{ item.name | default(item.username, true) | default(item.caname, true) }}-CA.pem"
        dest: "{{ ejbca_csr_dir_output }}/{{ item.caname }}.crt"
        flat: yes
      tags: certreq-cli-batch

  when:
    - item.token == 'PEM'
    - item.useType is defined
    - (item.useType == "ra") or (item.useType == "va") or (item.useType == "root") or (item.useType == "signserver")
    - ra_batch_result is defined
    - ra_batch_result.changed|bool or
      ra_force_batch_again is defined and ra_force_batch_again|bool

- name: Cleanup the cert files in /var/tmp
  ansible.builtin.file:
    path: "{{ identity_batch_output_dir }}/pem/"
    state: absent
  tags: certreq-cli-batch
  when:
    - item.token == 'PEM'
    - item.useType is defined
    - (item.useType == "ra") or (item.useType == "va") or (item.useType == "root") or (item.useType == "signserver")
    - ra_batch_result is defined
    - ra_batch_result.changed|bool
